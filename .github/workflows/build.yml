name: Build COF iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '14.3.1'

      - name: Clone Xash3D-FWGS iOS Engine
        run: |
          git clone --recursive https://github.com/FWGS/xash3d-fwgs.git
          cd xash3d-fwgs/iOS

      - name: Build Xcode Project
        run: |
          cd xash3d-fwgs/iOS
          xcodebuild -project Xash3D.xcodeproj \
                     -scheme Xash3D-iOS \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r xash3d-fwgs/iOS/build/Release-iphoneos/*.app Payload/ 2>/dev/null || true
          zip -r COF-Xash3D.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: COF-iOS-IPA
          path: COF-Xash3D.ipa
